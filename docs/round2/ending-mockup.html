<title>零溶結局範例稿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面：上方是範例稿控制列（情境＋畫面切換），下方是一支 480px 寬的手機畫面；第三分頁是 1200×630 的分享圖卡縮圖。沿用遊戲結局的夜紫＋聖旨黃。 */
:root {
  --night: #241B30;
  --night-2: #3A2D4B;
  --night-line: #4E3F63;
  --text: #F3E9FF;
  --muted: #CDB8EE;
  --amber: #F4C66A;
  --edict: #F7E7BE;
  --edict-ink: #3B2208;
  --crimson: #8E2B2B;
  --seal: #C0262B;
  --serif: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --sans: 'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: #120C18; color: var(--text); font-family: var(--sans); }
button { font-family: inherit; color: inherit; cursor: pointer; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 控制列 */
.ctl { max-width: 1000px; margin: 0 auto; padding-block: 14px 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.ctl h1 { font-family: var(--serif); font-size: 18px; margin: 0; color: var(--amber); flex: 1 1 100%; }
.seg { display: flex; border: 1px solid var(--night-line); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: none; padding: 8px 12px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--night); font-weight: 700; }
.replay { background: var(--night-2); border: 1px solid var(--night-line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.lbl { font-size: 12px; color: var(--muted); }

/* 手機畫面 */
.phone { position: relative; max-width: 420px; margin: 8px auto 24px; min-height: 760px; border-radius: 22px; overflow: hidden; border: 1px solid var(--night-line);
  background: linear-gradient(rgba(20,12,34,.62), rgba(20,12,34,.94)), url(img/yanxi.webp) center/cover, var(--night); display: flex; flex-direction: column; }
.cap { text-align: center; font-size: 13px; letter-spacing: 6px; color: var(--muted); padding-top: 22px; }
.eunuch { text-align: center; font-family: var(--serif); font-weight: 900; font-size: 26px; color: var(--amber); letter-spacing: 6px; margin-top: 6px; animation: drop .6s both; }

/* 畫面一：恩寵榜揭曉 */
.board { display: flex; flex-direction: column; gap: 10px; padding: 22px 18px 0; }
.rk { display: grid; grid-template-columns: 34px 52px 1fr; align-items: center; gap: 10px; opacity: 0; transform: translateX(-20px); }
.rk.show { animation: slide .5s forwards; }
.rk .no { font-family: var(--serif); font-weight: 900; font-size: 20px; color: var(--muted); text-align: center; }
.rk.first .no { color: var(--amber); font-size: 26px; }
.av { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: var(--c); border: 2px solid var(--c); }
.av img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.rk .nm { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; }
.rk .nm b { color: var(--amber); font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.08); margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 6px; transition: width .9s cubic-bezier(.2,.8,.3,1); }
.rk.first { padding: 8px; margin: 0 -8px; border-radius: 12px; background: rgba(244,198,106,.1); box-shadow: 0 0 0 2px var(--amber); }
.verdict { position: relative; margin: 26px 18px 0; text-align: center; opacity: 0; }
.verdict.show { animation: pop .6s cubic-bezier(.3,1.6,.5,1) forwards; }
.verdict .big { font-family: var(--serif); font-weight: 900; font-size: 34px; line-height: 1.25; color: var(--amber); text-shadow: 0 0 18px rgba(244,198,106,.5); }
.verdict .small { margin-top: 8px; font-size: 14px; color: var(--text); }
.verdict .who { margin-top: 6px; font-size: 13px; color: var(--muted); }
.hero { position: absolute; right: -40px; bottom: 70px; width: 230px; opacity: 0; pointer-events: none; }
.hero.show { animation: fade .8s .2s forwards; }
.hero img { width: 100%; display: block; filter: drop-shadow(0 0 16px rgba(160,100,255,.5)); }
.cower { position: absolute; left: 10px; bottom: 74px; width: 110px; opacity: 0; transform: rotate(-6deg) scale(.9); }
.cower.show { animation: fade .6s .6s forwards; }
.cower img { width: 100%; display: block; filter: grayscale(.3) brightness(.85); }
.next { margin: auto 18px 18px; position: relative; z-index: 2; }

/* 畫面二：封號＋戰績 */
.edict { position: relative; margin: 24px 26px 0; padding: 18px 16px 20px; border-radius: 6px; background: var(--edict); color: var(--edict-ink); box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: unroll .7s both; transform-origin: top; }
.edict::before, .edict::after { content: ''; position: absolute; left: -14px; right: -14px; height: 14px; border-radius: 7px; background: linear-gradient(180deg, #8a5a1e, #5a3510); }
.edict::before { top: -16px; } .edict::after { bottom: -16px; }
.e-hd { text-align: center; font-family: var(--serif); font-weight: 900; letter-spacing: 6px; color: #7a1f2b; font-size: 14px; }
.e-sub { text-align: center; font-size: 13px; margin-top: 6px; color: #5a3510; }
.stampwrap { display: grid; place-items: center; margin: 12px 0 6px; }
.stamp { width: 150px; height: 150px; border: 5px solid var(--seal); border-radius: 12px; display: grid; place-items: center; text-align: center; color: var(--seal); font-family: var(--serif); font-weight: 900; font-size: 30px; line-height: 1.15; transform: rotate(-6deg); background: rgba(192,38,43,.06); opacity: 0; }
.stamp.show { animation: stamp .45s cubic-bezier(.2,1.4,.4,1) forwards; }
.comment { font-size: 14px; line-height: 1.6; text-align: center; margin: 6px 4px 0; }
.extra { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #b8892e; font-size: 13px; text-align: center; color: #5a3510; }
.chip { display: inline-block; margin: 4px 3px 0; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--seal); color: var(--seal); font-weight: 700; font-size: 12.5px; opacity: 0; }
.chip.show { animation: pop .4s cubic-bezier(.3,1.6,.5,1) forwards; }
.stats { margin: 26px 18px 0; display: flex; flex-direction: column; gap: 6px; }
.stats h2 { font-family: var(--serif); font-size: 15px; margin: 0 0 2px; color: var(--amber); }
.stat { display: flex; gap: 10px; align-items: baseline; font-size: 14px; background: rgba(36,27,48,.85); border: 1px solid var(--night-line); border-radius: 10px; padding: 8px 12px; }
.stat b { font-family: var(--serif); color: var(--amber); font-size: 18px; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 18px 18px; }
.btn { min-height: 50px; border-radius: 999px; font-weight: 700; font-size: 15px; letter-spacing: 2px; }
.btn.gold { grid-column: 1 / -1; border: 2px solid #fff3cf; background: linear-gradient(180deg, #f9dc8f, #d9a441); color: #3a1d12; }
.btn.ghost { background: transparent; border: 2px solid var(--amber); color: var(--amber); }
.booklink { text-align: center; font-size: 12px; color: var(--muted); margin-top: -6px; margin-bottom: 18px; }

/* 分享圖卡 */
.cardbox { max-width: 1000px; margin: 8px auto 24px; }
.cardbox p { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.scaler { width: 100%; aspect-ratio: 1200 / 630; position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--night-line); container-type: inline-size; }
.card { position: absolute; inset: 0; display: grid; grid-template-columns: 1.15fr 1fr; background: linear-gradient(120deg, #2b1d3d, #1a1224 60%), var(--night); font-size: 1.4cqw; }
.card .left { padding: 4cqw 3cqw 3cqw 5cqw; display: flex; flex-direction: column; gap: 1.4cqw; }
.card .game { font-family: var(--serif); font-weight: 900; color: var(--amber); font-size: 2.6cqw; letter-spacing: .3cqw; }
.card .mini-edict { background: var(--edict); color: var(--edict-ink); border-radius: .6cqw; padding: 2cqw 2.4cqw; position: relative; }
.card .mini-edict .t { font-size: 1.5cqw; letter-spacing: .4cqw; color: #7a1f2b; font-weight: 900; text-align: center; }
.card .mini-edict .title { font-family: var(--serif); font-weight: 900; font-size: 5.2cqw; color: var(--seal); text-align: center; line-height: 1.2; margin: .8cqw 0; }
.card .mini-edict .c { font-size: 1.7cqw; text-align: center; line-height: 1.5; }
.card .mini-edict .seal { position: absolute; right: 1.4cqw; bottom: 1.2cqw; width: 5.4cqw; height: 5.4cqw; border: .35cqw solid var(--seal); border-radius: .6cqw; color: var(--seal); font-family: var(--serif); font-weight: 900; font-size: 1.5cqw; display: grid; place-items: center; text-align: center; line-height: 1.1; transform: rotate(-8deg); }
.card .lines { display: flex; flex-wrap: wrap; gap: .8cqw; }
.card .lines span { font-size: 1.6cqw; padding: .4cqw 1.2cqw; border-radius: 99cqw; background: rgba(255,255,255,.08); color: var(--text); }
.card .lines b { color: var(--amber); }
.card .url { margin-top: auto; font-size: 1.5cqw; color: var(--muted); }
.card .right { position: relative; }
.card .right img { position: absolute; bottom: 0; right: 2cqw; height: 96%; filter: drop-shadow(0 0 2cqw rgba(160,100,255,.45)); }
.card .rank { position: absolute; top: 4cqw; right: 3cqw; text-align: right; font-family: var(--serif); font-weight: 900; color: var(--amber); font-size: 2.4cqw; line-height: 1.3; text-shadow: 0 0 1cqw rgba(0,0,0,.6); z-index: 1; }

@keyframes slide { to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
@keyframes fade { to { opacity: 1; } }
@keyframes drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
@keyframes unroll { from { transform: scaleY(.05); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes stamp { 0% { opacity: 0; transform: rotate(-6deg) scale(2.4); } 70% { opacity: 1; transform: rotate(-6deg) scale(.92); } 100% { opacity: 1; transform: rotate(-6deg) scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
</style>

<div class="wrap">
  <div class="ctl">
    <h1>結局範例稿</h1>
    <span class="lbl">情境</span>
    <div class="seg" id="scen">
      <button aria-pressed="true" data-s="ling">零溶第一</button>
      <button aria-pressed="false" data-s="zhen">真環第一</button>
    </div>
    <span class="lbl">畫面</span>
    <div class="seg" id="view">
      <button aria-pressed="true" data-v="1">一 誰最受寵</button>
      <button aria-pressed="false" data-v="2">二 封號與戰績</button>
      <button aria-pressed="false" data-v="3">分享圖卡</button>
    </div>
    <button class="replay" id="replay">重播演出</button>
  </div>
</div>
<div class="wrap"><div id="out"></div></div>

<script>
(() => {
  const P = {
    lingrong: { n: '零溶', c: '#9a6fd6', img: 'lingrong_evil' },
    huafei: { n: '滑妃', c: '#d6604a', img: 'huafei_happy' },
    meizhuang: { n: '審沒裝', c: '#5b9a7a', img: 'meizhuang_happy' },
    zhenhuan: { n: '真環', c: '#e07f9c', img: 'zhenhuan_happy' },
  };
  const SC = {
    ling: {
      rank: [['lingrong', 78], ['zhenhuan', 66], ['huafei', 52], ['meizhuang', 41]],
      big: '即日起<br>改姓鈕祜祿！', small: '安嬪零溶恩寵冠絕六宮。', who: '炎洗宮上下跪接聖旨，包捐哭成淚人。',
      main: { name: '原著重現', seal: '原著<br>重現', comment: '劇本拿來，演得一字不差。欽此。' },
      extra: ['麝香代言人', '炎洗宮米其林', '真・妙音娘子'],
      stats: [['3', '次下料，被溫太醫抓了', '1', '次'], ['5', '次正中下懷，各宮都說安嬪最懂她'], ['4', '次高歌金縷衣，黃上現在閉眼就聽得到'], ['1', '鍋完美成品，御膳房派人來偷師']],
      chips: [['恩寵', '第 1 名'], ['下料', '3'], ['被抓', '1'], ['正中下懷', '5']],
    },
    zhen: {
      rank: [['zhenhuan', 82], ['lingrong', 64], ['huafei', 55], ['meizhuang', 40]],
      big: '真環恩寵冠絕六宮', small: '晉為熹妃，睡慾軒門庭若市。', who: '安嬪零溶屈居第二，只差一點點。',
      main: { name: '包捐才是本體', seal: '包捐<br>才是本體', comment: '十天來各宮只見過包捐。有人懷疑安嬪根本不存在。欽此。' },
      extra: ['甘露寺預備役', '敬事房大金主'],
      stats: [['6', '張訂單全由包捐代交，安嬪本人查無此人'], ['4', '次抄經，甘露寺禪房已預留'], ['2', '次給敬事房包大紅包'], ['0', '次下料，清清白白']],
      chips: [['恩寵', '第 2 名'], ['下料', '0'], ['抄經', '4'], ['包捐代交', '6']],
    },
  };
  let scen = 'ling', view = '1';
  const out = document.getElementById('out');
  const img = (k, alt = '') => `<img src="img/${k}.webp" alt="${alt}">`;

  function screen1() {
    const s = SC[scen]; const top = s.rank[0][0];
    const order = s.rank.map((r, i) => ({ k: r[0], v: r[1], no: i + 1 })).reverse();
    out.innerHTML = `<div class="phone">
      <div class="cap">— 十日期滿 —</div>
      <div class="eunuch">聖旨到——</div>
      <div class="board">${s.rank.map(([k, v], i) => `
        <div class="rk ${i === 0 ? 'first' : ''}" data-k="${k}" style="--c:${P[k].c}">
          <span class="no">${i + 1}</span>
          <span class="av">${img(P[k].img, P[k].n)}</span>
          <span><span class="nm">${P[k].n}<b>${v}</b></span><span class="bar"><i data-w="${v}"></i></span></span>
        </div>`).join('')}</div>
      <div class="verdict" id="verdict"><div class="big">${s.big}</div><div class="small">${s.small}</div><div class="who">${s.who}</div></div>
      <div class="hero" id="hero">${img(top === 'lingrong' ? 'lingrong_evil' : P[top].img)}</div>
      ${top !== 'lingrong' ? `<div class="cower" id="cower">${img('lingrong_shock')}</div>` : ''}
      <button class="btn ghost next" data-go="2">看看零溶得了什麼封號 →</button>
    </div>`;
    // 從第 4 名往第 1 名揭曉
    order.forEach((r, n) => setTimeout(() => {
      const row = out.querySelector(`.rk[data-k="${r.k}"]`); row.classList.add('show');
      setTimeout(() => { row.querySelector('i').style.width = `${r.v}%`; }, 150);
    }, 400 + n * 700));
    const done = 400 + order.length * 700 + 300;
    setTimeout(() => { out.querySelector('#verdict').classList.add('show'); out.querySelector('#hero').classList.add('show'); const c = out.querySelector('#cower'); if (c) c.classList.add('show'); }, done);
  }

  function screen2() {
    const s = SC[scen];
    out.innerHTML = `<div class="phone">
      <div class="cap">— 十日期滿 —</div>
      <div class="edict">
        <div class="e-hd">奉天承運　黃上詔曰</div>
        <div class="e-sub">茲賜${scen === 'ling' ? '鈕祜祿氏零溶' : '炎洗宮安嬪零溶'}封號——</div>
        <div class="stampwrap"><div class="stamp" id="stamp">${s.main.seal}</div></div>
        <p class="comment">${s.main.comment}</p>
        <div class="extra">另外加封<br>${s.extra.map((t) => `<span class="chip">${t}</span>`).join('')}</div>
      </div>
      <div class="stats"><h2>十日戰績</h2>${s.stats.map((x) => `<div class="stat"><b>${x[0]}</b><span>${x[1]}${x[2] ? `<b style="font-size:15px;margin:0 2px">${x[2]}</b>${x[3]}` : ''}</span></div>`).join('')}</div>
      <div class="btns">
        <button class="btn gold">分享到 FB</button>
        <button class="btn ghost">其他分享</button>
        <button class="btn ghost">再玩一次</button>
      </div>
      <div class="booklink">封號冊 已收集 7 / 16　›</div>
    </div>`;
    setTimeout(() => out.querySelector('#stamp').classList.add('show'), 700);
    out.querySelectorAll('.chip').forEach((c, i) => setTimeout(() => c.classList.add('show'), 1300 + i * 280));
  }

  function screen3() {
    const s = SC[scen]; const top = s.rank[0][0];
    out.innerHTML = `<div class="cardbox">
      <p>分享出去時，FB 動態上會顯示這張 1200×630 的圖卡（這裡是縮小預覽）。</p>
      <div class="scaler"><div class="card">
        <div class="left">
          <div class="game">煉金術士零溶——逆襲a零溶</div>
          <div class="mini-edict">
            <div class="t">黃上詔曰　茲賜封號</div>
            <div class="title">${s.main.name}</div>
            <div class="c">${s.main.comment.replace('欽此。', '')}</div>
            <div class="seal">黃上<br>之寶</div>
          </div>
          <div class="lines">${s.chips.map(([a, b]) => `<span>${a} <b>${b}</b></span>`).join('')}</div>
          <div class="url">你能逆襲嗎？ hsin-rui.github.io/alchemist-lingrong</div>
        </div>
        <div class="right">
          <div class="rank">${top === 'lingrong' ? '改姓鈕祜祿！' : `恩寵第 ${SC[scen].rank.findIndex((r) => r[0] === 'lingrong') + 1} 名`}</div>
          ${img(top === 'lingrong' ? 'lingrong_evil' : 'lingrong_shock')}
        </div>
      </div></div>
    </div>`;
  }

  function render() { ({ 1: screen1, 2: screen2, 3: screen3 })[view](); }
  function seg(id, attr, set) {
    document.querySelectorAll(`#${id} button`).forEach((b) => b.onclick = () => {
      document.querySelectorAll(`#${id} button`).forEach((x) => x.setAttribute('aria-pressed', x === b));
      set(b.dataset[attr]); render();
    });
  }
  seg('scen', 's', (v) => { scen = v; });
  seg('view', 'v', (v) => { view = v; });
  document.getElementById('replay').onclick = render;
  out.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]'); if (!g) return;
    view = g.dataset.go;
    document.querySelectorAll('#view button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === view));
    render();
  });
  render();
})();
</script>
