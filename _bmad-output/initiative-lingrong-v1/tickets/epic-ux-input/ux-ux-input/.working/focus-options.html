<h1>焦點框選項（真實主畫面截圖）</h1><p>每張圖都框了兩個東西：侍寢卡的「送禮」和導覽列的「採集」。表示「現在按 Enter 會按下這個」。</p>
<div class="g">
<figure><img src="focus-a.png"><figcaption><b>A 金框發光</b>：金色外框＋柔光暈</figcaption></figure>
<figure><img src="focus-b.png"><figcaption><b>B 左側指標 ▶</b>：像 RPG 選單的小箭頭，按鈕本身不變</figcaption></figure>
<figure><img src="focus-c.png"><figcaption><b>C 浮起放大</b>：按鈕微微放大浮起＋金邊</figcaption></figure>
<figure><img src="focus-d.png"><figcaption><b>D 四角框</b>：朱紅色的四個角，像相機對焦／選取框</figcaption></figure>
