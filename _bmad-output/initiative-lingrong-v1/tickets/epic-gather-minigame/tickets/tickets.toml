# Epic 2「採集互動小遊戲」的 stories，依 build order。tracer 先。
# 規格權威：docs/game-design.md §12。建在 epic 1 的純引擎上。

[[entry]]
id = 1
type = "story"
title = "御花園像素潛行地下城（tracer）"
description = "（2026-11-22 改方向，取代第一版即時閃避外殼）點『御花園』轉場進入超任像素風的回合制隨機地下城：25×31 格、5～7 個庭院＋走廊、迷霧與視野；零溶 8 方向一次一格（不可斜切牆角）、可原地等，踩到素材自動撿；2 名侍衛隨機出生、巡邏／發現（！）／追擊／跟丟（？）、侍衛回合能一步走到零溶即被抓；60 步用完、被抓或收工結束，收穫全保留、花 1 時辰。電腦 W/A/D/X＋方向鍵、Q/E/Z/C、S 等、Esc 收工；手機 3×3 方向盤。引擎純函式：buildGatherDungeon／gatherStep／gatherFov＋沿用 applyGatherHaul；外殼 canvas 繪製、補間、轉場、音效與 8-bit BGM。像素美術全套依 docs/pixel-art-spec.md 以 js/pixelart.js 內嵌資料製作，附 tools/pixel-preview.html。"
verify = "瀏覽器實玩御花園：轉場進出明顯、地圖每次不同、能 8 方向走與等、撿素材、侍衛會發現並追擊、被抓／60 步／收工皆正確結束且收穫進包包、花 1 時辰；像素圖 1 倍可辨識、整數倍銳利；node --test 生成不變式（多 seed）、回合規則、侍衛 AI、像素資料格式全通過；既有回歸網一輪 10 天仍 20/20、0 錯誤。"
covers = ["R3"]
after = ["epic-engine-refactor"]
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "太醫院地圖＋地圖資料化"
description = "把採集地圖抽成資料驅動表（像素圖塊主題 tileset、素材集、稀有、躲誰、地下城參數），新增太醫院（太醫院像素圖塊、太醫 doctor 像素 sprite、稀有＝麝香），兩張地圖共用同一套地下城生成與回合邏輯；沿用各自 §8 素材集、保證每種至少出現 1 個。此後新增地圖只需加資料。"
verify = "御花園與太醫院皆可進場遊玩、各自素材與稀有正確（麝香必出）；地圖以資料表定義、加地圖只需加資料；node --test 場景生成對兩圖通過；回歸網一輪 10 天不破壞。"
covers = ["R3"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "採集手感打磨＋被抓懲罰旋鈕"
description = "打磨兩圖的採集體驗：方向盤／鍵盤手感、動畫與音效、難度微調（步數／侍衛數與視野／地圖大小）、（視需要）花叢躲藏；並加入『被抓』懲罰可調旋鈕（禁足或掉友好，預設關，開啟才生效）。範圍為既有兩圖的體驗打磨與可調參數，不新增地圖。epic 收尾：掃掉前兩票 plan/review 延後的採集相關清理。"
verify = "實玩手感順、稀有提示清楚、難度合理；被抓懲罰旋鈕可開關且預設不改變 MVP 行為；node --test 與回歸網通過；一輪 10 天可完整玩到結局。"
covers = ["R3"]
after = [2]
hitl = true
risk = "low"
