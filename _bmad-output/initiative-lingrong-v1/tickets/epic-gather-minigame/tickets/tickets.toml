# Epic 2「採集互動小遊戲」的 stories，依 build order。tracer 先。
# 規格權威：docs/game-design.md §12。建在 epic 1 的純引擎上。

[[entry]]
id = 1
type = "story"
title = "御花園最小可玩版（tracer）"
description = "點『御花園』改為進入即時小場景（garden 背景）：搖桿（手機）／方向鍵或 WASD（電腦）操控零溶移動，踩到或靠近素材即撿起進既有包包；一名巡邏守衛碰到即被抓；30 秒倒數；時間到或被抓即結束，收穫回灌包包（不沒收），仍花 1 時辰。引擎新增純函式：場景生成（撒素材、保證每種≥1、必出稀有癢癢粉）與收穫套用（invAdd＋dayLog/ready），隨機走注入 rand、可 seeded 單元測；移動／碰撞／倒數／搖桿／鍵盤在外殼。御花園侍衛暫用佔位圖。"
verify = "瀏覽器實玩御花園：能移動、能撿、碰到守衛或時間到即結束、收穫進包包且花 1 時辰；node --test 場景生成／收穫套用單元測試通過；既有回歸網一輪 10 天仍 20/20 到結局、0 錯誤。"
covers = ["R3"]
after = ["epic-engine-refactor"]
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "太醫院地圖＋地圖資料化"
description = "把採集地圖抽成資料驅動表（背景、素材集、稀有、躲誰、守衛參數），新增太醫院（躲太醫 doctor、稀有＝麝香），兩張地圖共用同一套場景生成與互動邏輯；沿用各自 §8 素材集、保證每種至少出現 1 個。此後新增地圖只需加資料。"
verify = "御花園與太醫院皆可進場遊玩、各自素材與稀有正確（麝香必出）；地圖以資料表定義、加地圖只需加資料；node --test 場景生成對兩圖通過；回歸網一輪 10 天不破壞。"
covers = ["R3"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "採集手感打磨＋被抓懲罰旋鈕"
description = "打磨兩圖的採集體驗：搖桿／鍵盤移動手感、撿取與被抓的動畫／音效、難度微調（秒數／守衛速度／巡邏路徑）、稀有素材視覺提示；並加入『被抓』懲罰可調旋鈕（禁足或掉友好，預設關，開啟才生效）。範圍為既有兩圖的體驗打磨與可調參數，不新增地圖。epic 收尾：掃掉前兩票 plan/review 延後的採集相關清理。"
verify = "實玩手感順、稀有提示清楚、難度合理；被抓懲罰旋鈕可開關且預設不改變 MVP 行為；node --test 與回歸網通過；一輪 10 天可完整玩到結局。"
covers = ["R3"]
after = [2]
hitl = true
risk = "low"
